<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <title>Ascolti</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Lista principale -->
  <main id="home" class="screen">
    <!-- Selezione multipla (tieni premuto un album) -->
    <header class="top select-bar" id="select-bar" hidden>
      <button class="icon-btn" data-act="select-exit" aria-label="Esci dalla selezione">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
      <span class="select-count" id="select-count"></span>
      <button class="select-action" data-act="select-all">Tutti</button>
      <button class="select-action danger" data-act="select-delete">Elimina</button>
    </header>
    <header class="top" id="top-bar">
      <nav class="tabs" id="tabs">
        <button data-act="tab" data-tab="todo">Da ascoltare<sup id="count-todo"></sup></button>
        <button data-act="tab" data-tab="done">Ascoltati<sup id="count-done"></sup></button>
      </nav>
      <button class="icon-btn" data-act="open-settings" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
    </header>
    <div id="update-banner" class="update-banner" hidden></div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty"></p>
    <button class="fab" data-act="open-search" aria-label="Aggiungi album">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </main>

  <!-- Ricerca -->
  <section id="search" class="screen overlay" hidden>
    <header class="search-bar">
      <button class="icon-btn" data-act="close" aria-label="Indietro">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="search-field">
        <input id="q" type="search" placeholder="Album o artista" autocomplete="off" enterkeyhint="search" />
        <button class="clear-btn" id="q-clear" data-act="clear-search" aria-label="Cancella la ricerca" hidden>
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </header>
    <p class="status" id="status"></p>
    <ul class="list" id="results"></ul>
    <div class="manual-link"><button data-act="open-manual">Non lo trovi? Aggiungilo a mano</button></div>
  </section>

  <!-- Inserimento manuale -->
  <section id="manual" class="screen overlay" hidden>
    <header class="plain-bar">
      <button class="icon-btn" data-act="close" aria-label="Indietro">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Aggiungi a mano</h2>
    </header>
    <form id="manual-form" class="form">
      <label>Titolo<input name="title" required autocomplete="off" /></label>
      <label>Artista<input name="artist" required autocomplete="off" /></label>
      <label>Anno<input name="year" inputmode="numeric" maxlength="4" autocomplete="off" /></label>
      <button class="primary" type="submit">Aggiungi</button>
    </form>
  </section>

  <!-- Impostazioni -->
  <section id="settings" class="screen overlay" hidden>
    <header class="plain-bar">
      <button class="icon-btn" data-act="close" aria-label="Indietro">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Impostazioni</h2>
    </header>
    <div class="form">
      <label class="switch-row">
        <span>Tema scuro</span>
        <input type="checkbox" id="theme-switch" role="switch" />
        <i class="switch" aria-hidden="true"></i>
      </label>
      <label class="switch-row">
        <span>Vista a schede</span>
        <input type="checkbox" id="view-switch" role="switch" />
        <i class="switch" aria-hidden="true"></i>
      </label>
      <div class="seg-row" id="cols-row" hidden>
        <span>Schede per riga</span>
        <div class="seg" role="radiogroup" aria-label="Schede per riga">
          <button data-act="cols" data-cols="2" role="radio">2</button>
          <button data-act="cols" data-cols="3" role="radio">3</button>
        </div>
      </div>

      <h3>Backup</h3>
      <p class="hint">Copia il testo qui sotto per salvare la tua lista, oppure incolla un backup e premi Importa.</p>
      <textarea id="backup" rows="5" spellcheck="false"></textarea>
      <div class="row-btns">
        <button class="ghost" data-act="export">Esporta</button>
        <button class="ghost" data-act="import">Importa</button>
      </div>

      <h3>Aggiornamenti</h3>
      <p class="hint" id="app-version"></p>
      <button class="primary" data-act="check-update">Controlla aggiornamenti</button>
      <p class="status" id="upd-status"></p>
      <div id="upd-panel" class="update-banner in-settings" hidden></div>

      <p class="credit">made with 🪗 by <a href="https://www.instagram.com/dariotronic/" target="_blank" rel="noopener">@dariotronic</a></p>
    </div>
  </section>

  <!-- Dettaglio album -->
  <div id="sheet-backdrop" class="backdrop" data-act="close" hidden></div>
  <section id="sheet" class="sheet" hidden></section>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
