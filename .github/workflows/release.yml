# Pubblica una nuova versione di Ascolti: compila, firma con la chiave nei secret della repo,
# fa commit della versione, tag vX.Y.Z e crea la Release con l'APK allegata.
# Si avvia da GitHub (Actions → Release → Run workflow) o da ./release.sh.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione (es. 1.0.1)"
        required: true
      notes:
        description: "Cosa cambia"
        required: false
        default: ""
      dry_run:
        description: "Solo prova: compila e verifica la firma senza pubblicare"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

env:
  # Impronta SHA-256 del certificato di firma di Ascolti (pubblica: la mostra qualunque APK firmata)
  EXPECTED_CERT: da0d09f3a7cd6df98fbf64a0c475708d00d4b9f3756358cba14c8544b8e6cd0c

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Controlla la versione
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versione non valida: $VERSION (serve X.Y.Z)"; exit 1; }
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "::error::La versione v$VERSION esiste già"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Lettura dei link e classifica della ricerca (test/): se un test fallisce, la release non parte
      - name: Test
        run: npm test

      - name: Imposta la versione
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Manca il secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ascolti.jks"
          {
            echo "storeFile=$RUNNER_TEMP/ascolti.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "ASCOLTI_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - run: npx cap sync android

      - name: Compila l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verifica la firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt
          grep -E "DN|SHA-256" certs.txt
          grep -qi "SHA-256 digest: $EXPECTED_CERT" certs.txt || { echo "::error::L'APK non è firmata con la chiave di Ascolti"; exit 1; }
          cp "$APK" Ascolti.apk
          sha256sum Ascolti.apk

      - name: Pulisci la chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/ascolti.jks" "$RUNNER_TEMP/keystore.properties"

      - name: Allega l'APK di prova
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: Ascolti-${{ inputs.version }}-prova
          path: Ascolti.apk
          retention-days: 3

      - name: Commit, tag e release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Versione $VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
          gh release create "v$VERSION" Ascolti.apk --title "Ascolti $VERSION" --notes "${NOTES:-Versione $VERSION}"
